---
- name: Check installed gnsstrack version
  ansible.builtin.command: gnsstrack version
  register: gnsstrack_installed_version
  failed_when: false
  changed_when: false
  check_mode: false

- name: Create temp extract directory
  ansible.builtin.file:
    path: /tmp/gnsstrack-extract
    state: directory
    mode: "0755"
  when: gnsstrack_installed_version.rc != 0 or gnsstrack_version not in gnsstrack_installed_version.stdout
  check_mode: false

- name: Download gnsstrack release tarball
  ansible.builtin.get_url:
    url: "https://github.com/4d46/gnsstrack/releases/download/{{ gnsstrack_version }}/gnsstrack-linux-arm64.tar.gz"
    dest: /tmp/gnsstrack.tar.gz
    mode: "0644"
    checksum: "{{ gnsstrack_tarball_checksum }}"
  when: gnsstrack_installed_version.rc != 0 or gnsstrack_version not in gnsstrack_installed_version.stdout
  check_mode: false

- name: Extract gnsstrack tarball
  ansible.builtin.unarchive:
    src: /tmp/gnsstrack.tar.gz
    dest: /tmp/gnsstrack-extract/
    remote_src: true
  when: gnsstrack_installed_version.rc != 0 or gnsstrack_version not in gnsstrack_installed_version.stdout
  check_mode: false

- name: Install gnsstrack binary
  ansible.builtin.copy:
    src: /tmp/gnsstrack-extract/gnsstrack
    dest: /usr/local/bin/gnsstrack
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  when:
    - gnsstrack_installed_version.rc != 0 or gnsstrack_version not in gnsstrack_installed_version.stdout
    - not ansible_check_mode
  notify: Restart gnsstrack

- name: Install gnsstrack systemd unit
  ansible.builtin.copy:
    src: /tmp/gnsstrack-extract/gnsstrack.service
    dest: /etc/systemd/system/gnsstrack.service
    owner: root
    group: root
    mode: "0644"
    remote_src: true
  when:
    - gnsstrack_installed_version.rc != 0 or gnsstrack_version not in gnsstrack_installed_version.stdout
    - not ansible_check_mode
  notify:
    - Reload systemd
    - Restart gnsstrack

- name: Clean up temp extract directory
  ansible.builtin.file:
    path: /tmp/gnsstrack-extract
    state: absent
  when: gnsstrack_installed_version.rc != 0 or gnsstrack_version not in gnsstrack_installed_version.stdout

- name: Create gnsstrack config directory
  ansible.builtin.file:
    path: /etc/gnsstrack
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create gnsstrack log directory
  ansible.builtin.file:
    path: "{{ gnsstrack_log_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy gnsstrack config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/gnsstrack/config.yaml
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Restart gnsstrack

- name: Enable and start gnsstrack service
  ansible.builtin.systemd:
    name: gnsstrack
    enabled: true
    state: started
    daemon_reload: true
