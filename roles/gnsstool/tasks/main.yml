---
- name: Create gnsstool installation directory
  ansible.builtin.file:
    path: /opt/gnsstool
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy gnsstool.py
  ansible.builtin.copy:
    src: gnsstool.py
    dest: /opt/gnsstool/gnsstool.py
    owner: root
    group: root
    mode: "0755"

- name: Deploy README.md and CHANGELOG.md
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/opt/gnsstool/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - README.md
    - CHANGELOG.md

# Build info for `gnsstool version`: the commit this repo was deployed from, and that
# commit's date (not the deploy date, so re-runs don't report a change every day).
# `--dirty` flags a deploy made with uncommitted changes to tracked files.
- name: Get repository commit for gnsstool build info
  ansible.builtin.command: "{{ item }}"
  args:
    chdir: "{{ playbook_dir }}"
  loop:
    - git describe --always --dirty --abbrev=7
    - git log -1 --format=%cs
  register: gnsstool_git_info
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false
  failed_when: false
  check_mode: false

- name: Write gnsstool build info
  ansible.builtin.copy:
    content: >-
      commit {{ gnsstool_git_info.results[0].stdout | default('unknown', true) }},
      {{ gnsstool_git_info.results[1].stdout | default('unknown date', true) }}
    dest: /opt/gnsstool/BUILD
    owner: root
    group: root
    mode: "0644"

- name: Create venv and install smbus2
  ansible.builtin.pip:
    name: smbus2
    virtualenv: /opt/gnsstool/venv
    virtualenv_command: python3 -m venv

- name: Add admin user to i2c group for device access without sudo
  ansible.builtin.user:
    name: "{{ admin_user }}"
    groups: i2c
    append: true

- name: Install gnsstool command
  ansible.builtin.copy:
    dest: /usr/local/bin/gnsstool
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/bin/bash
      exec /opt/gnsstool/venv/bin/python3 /opt/gnsstool/gnsstool.py "$@"

- name: Ensure bash-completion is installed
  ansible.builtin.apt:
    name: bash-completion
    state: present
  when: "'bash' in gnsstool_shell_completions"

- name: Create shell completion directories
  ansible.builtin.file:
    path: "{{ gnsstool_completion_paths[item] | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ gnsstool_shell_completions }}"

# The tool prints its own completion scripts from its argparse definitions, so
# they always match the installed version. In check mode on a host where
# gnsstool isn't installed yet this can't run, so the install step is skipped.
- name: Generate gnsstool shell completion scripts
  ansible.builtin.command: /usr/local/bin/gnsstool completion {{ item }}
  loop: "{{ gnsstool_shell_completions }}"
  register: gnsstool_completion_scripts
  changed_when: false
  failed_when: gnsstool_completion_scripts.rc != 0 and not ansible_check_mode
  check_mode: false

- name: Install gnsstool shell completion scripts
  ansible.builtin.copy:
    content: "{{ item.stdout }}\n"
    dest: "{{ gnsstool_completion_paths[item.item] }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ gnsstool_completion_scripts.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc == 0
