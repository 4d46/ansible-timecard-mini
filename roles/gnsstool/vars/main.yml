---
# Where each shell looks for completion scripts. /usr/local/share is the FHS
# location for software not owned by the package manager; both shells search it
# by default and load the script lazily, on first Tab after the command name.
gnsstool_completion_paths:
  bash: /usr/local/share/bash-completion/completions/gnsstool
  zsh: /usr/local/share/zsh/site-functions/_gnsstool
