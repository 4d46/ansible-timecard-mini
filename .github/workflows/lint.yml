---
name: Ansible Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Lint only reads the repo; the token gets no write access.
permissions: read-all

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the job's token in .git/config for later steps to read.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Same interpreter as local runs: .tool-versions is the one source.
          python-version-file: .tool-versions

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Install zsh for completion tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends zsh

      - name: Run gnsstool unit tests
        run: python -m unittest discover -s roles/gnsstool/tests

      - name: Run ansible-lint
        run: ansible-lint playbook.yml
