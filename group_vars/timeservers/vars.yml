---
# Non-secret configuration.
# Vault variables are proxied here so templates use clean names.
# Secret values live only in vault.yml.tpl / 1Password — never here.

# --- System ---
admin_user: admin
admin_group: sudo
timezone: UTC
locale: en_GB.UTF-8
hostname_fqdn: "{{ vault_hostname_fqdn }}"
hostname_short: "{{ vault_hostname_short }}"

# SSH hardening — key auth confirmed working, password auth disabled
ssh_enforce_hardening: true

# --- Network ---
network_interface: eth0
ntp_allowed_network: "{{ vault_ntp_allowed_network }}"
ntp_allowed_netmask: "{{ vault_ntp_allowed_netmask }}"

# NTP fallback servers — UK National Physical Laboratory (UTC(NPL), atomic clock)
ntp_fallback_servers:
  - ntp1.npl.co.uk
  - ntp2.npl.co.uk

# --- Boot / Hardware ---
boot_order: "0xf16"                  # NVMe-first, eMMC fallback, USB last
pcie_enabled: true                   # PCIe for NVMe SSD on Waveshare CM4-IO-BASE-A

# --- TimeBeat ---
timebeat_version: "2.2.20"
timebeat_arch: arm64
timebeat_deb_url: "https://license.timebeat.app/releases/stable/{{ timebeat_version }}/timebeat-{{ timebeat_version }}-{{ timebeat_arch }}.deb"
timebeat_deb_dest: "/tmp/timebeat-{{ timebeat_version }}-{{ timebeat_arch }}.deb"
timebeat_deb_checksum: "sha256:8b25bf0603bf63d364539a2c159a1b3b6e93a236e6f9499a640aefb355380aee"
timebeat_config_dir: /etc/timebeat
timebeat_gnss_device: /dev/ttyS0    # mini-UART — confirmed working from original TimeBeat image
timebeat_gnss_baud: 9600
timebeat_gnss_offset: 225000000     # static offset in ns — from original TimeBeat image config
# Cable delay compensation in nanoseconds (ns).
# 3m RG174/RG58 cable is approx 15ns (5ns/m).
timebeat_gps_cable_delay: 15
timebeat_license_path: /etc/timebeat/timebeat.lic
timebeat_ntp_ip: "{{ ansible_host }}"    # IP TimeBeat binds NTP on (matches inventory host)
timebeat_cli_port: 65129
timebeat_cli_key: /etc/timebeat/cli_id_rsa
timebeat_cli_password: "{{ vault_timebeat_cli_password }}"

# --- TLS / certbot ---
certbot_gandi_ini: /etc/letsencrypt/gandi.ini
certbot_cert_dir: "/etc/letsencrypt/live/{{ hostname_fqdn }}"

# --- NTPsec / NTS ---
ntpsec_enabled: false                    # Disabled pending accuracy investigation; TimeBeat serves NTP
ntpsec_ssl_dir: /etc/ntpsec/ssl
nts_port: 4460

# --- Tools ---
gnss_survey_enabled: true
gnsstool_enabled: true
gnsstrack_enabled: true

# --- gnsstool ---
gnsstool_shell_completions: [bash, zsh]  # completion scripts to install; remove a shell to skip it

# --- gnsstrack ---
# Pinned release + SHA-256 of its tarball, like TimeBeat: never "latest", and
# the download is verified. To upgrade, update both together; the checksum is
# the asset's "digest" from the GitHub API:
#   gh api repos/4d46/gnsstrack/releases/tags/<tag> --jq '.assets[].digest'
gnsstrack_version: "v1.1.2"
gnsstrack_tarball_checksum: "sha256:d0259267620f75bceca4ea60d7859a2fbf99133161df1a9c0ed90e670e26a8b7"
gnsstrack_log_dir: /var/log/gnsstrack
gnsstrack_log_simulation_dir: /tmp/gnsstrack
gnsstrack_log_max_size_mb: 50
gnsstrack_log_max_backups: 100
gnsstrack_i2c_bus: 1
gnsstrack_i2c_address: "0x42"
gnsstrack_status_address: "127.0.0.1:6767"
gnsstrack_polling_software_rate_ms: 1000
gnsstrack_polling_normal_logging_rate_ms: 60000
gnsstrack_polling_enhanced_logging_rate_ms: 1000
gnsstrack_polling_enable_enhanced_on_anomaly: true
gnsstrack_rtc_bus: 1
gnsstrack_rtc_address: "0x68"
gnsstrack_rtc_logging_rate_ms: 360000

# --- Elasticsearch ---
timebeat_elasticsearch_host: "{{ vault_timebeat_elasticsearch_host }}"

# --- Firewall ---
ufw_allowed_ports:
  - { port: 22,   proto: tcp }       # SSH
  - { port: 123,  proto: udp }       # NTP
  - { port: 319,  proto: udp }       # PTP event messages
  - { port: 320,  proto: udp }       # PTP general messages
  - { port: 4460, proto: tcp }       # NTS key exchange (NTPsec)
